---
deployment:
  tasks:
    # Primary domain document root. For an addon/subdomain instead, point this
    # at that domain's docroot, e.g. /home/ojr1p1jbq9g6/public_html/yourdomain.com
    - export DEPLOYPATH=/home/ojr1p1jbq9g6/public_html
    - /bin/mkdir -p $DEPLOYPATH
    # Remove the previous build's fingerprinted bundles so they don't pile up
    - /bin/rm -rf $DEPLOYPATH/assets
    # Copy the pre-built static site (including dotfiles like .htaccess) into the docroot
    - /bin/cp -R artifacts/web/dist/public/. $DEPLOYPATH/
